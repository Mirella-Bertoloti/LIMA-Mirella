<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>

    <!-- Listas NÃO Ordenadas -->
    <ul>
        <li>Uva</li>
        <li>Maçã</li>
        <li>Banana</li>
    </ul>

    <!-- Listas Ordenadas -->
    <ol>
        <li>Uva</li>
        <li>Maçã</li>
        <li>Banana</li>
    </ol>

    <!-- Listas Aninhadas -->
     <ul>
        <li>Frutas</li>
        <ul>
            <li>Uva</li>
            <li>Maçã</li>
            <li>Banana</li>
        </ul>
     </ul>

    
    <!-- Atividade -->

    <ul>
        <li>Mirella</li>
        <li>Linda</li>
        <li>Demais</li>
    </ul>

    <ol>
        <li>Mirella</li>
        <li>Linda</li>
        <li>Demais</li>
    </ol>

    <ol>
        <li>Mirella</li>
        <ul>
            <li>Linda</li>
            <li>Perfeita</li>
            <li>Maravilhosa</li>
        </ul>
    </ol>


</body>
</html>
